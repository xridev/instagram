name: instagram
description: "A new Flutter project."
publish_to: 'none' 

version: 3.4.5+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  firebase_crashlytics: ^5.4.0
  flutter_svg: ^2.3.0
  readmore: ^3.0.0
  equatable: ^3.0.0
  fluttertoast: ^10.0.2
  get_it: ^9.3.0
  shared_preferences: ^2.5.5
  pull_to_refresh:
    git:
      url: https://github.com/peng8350/flutter_pulltorefresh
      ref: 0be096c1a822fb03b38115cd76d1bee7e5afdaa2
  carousel_slider: ^5.1.2
  stream_transform: ^2.1.2
  audioplayers: ^6.8.1
  audio_video_progress_bar: ^2.0.3
  flutter_phoenix: ^1.1.1
  easy_localization: ^3.0.8
  animated_text_kit: ^4.3.0
  record: ^7.1.1
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^4.0.4
  video_player: ^2.14.1
  flutter_video_thumbnail_plus: ^1.0.7
  shimmer: ^4.0.0
  get_storage: ^2.1.1
  get: ^4.7.3
  permission_handler: ^11.3.1
  overlay_support: ^2.1.0
  flutter_blurhash: ^0.9.1
  blurhash_dart: ^1.2.1
  image: ^4.10.1
  path_provider: ^2.1.6
  animated_splash_screen: ^1.3.0
  firebase_messaging: ^16.7.0
  agora_rtc_engine: ^6.6.4
  flutter_local_notifications: ^22.3.1
  scrollable_positioned_list: ^0.3.8
  flutter_launcher_icons: ^0.14.4
  image_picker_plus: ^1.1.0
  cupertino_icons: ^2.0.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/instagram.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/play_store_512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/splash/
