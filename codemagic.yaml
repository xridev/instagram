workflows:
  default-workflow:
    name: Instagram Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Install Android 36 SDK
        script: |
          export ANDROID_HOME=$HOME/programs/android-sdk
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;36.0.0"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
